# ===============================
# TEST PROFILE (H2 IN-MEMORY DB)
# ===============================

# MODE=MySQL ekleyerek MySQL uyumlulu\u011Funu aç\u0131yoruz
# NON_KEYWORDS=USER ekleyerek User kelimesi hatas\u0131n\u0131 engelliyoruz
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;NON_KEYWORDS=USER
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Bunu ekle: entity'leri tarayam\u0131yorsa bile hata daha net olur
spring.jpa.properties.hibernate.hbm2ddl.auto=create-drop

# testte port önemli de\u011Fil
server.port=0